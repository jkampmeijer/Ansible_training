---
- name: Ping all hosts
  hosts: grp_nodes
  gather_facts: false
  
  tasks:
    - name: Ping
      ansible.builtin.ping:
    - name: Collect facts
      ansible.builtin.setup:
    - name: Debug_msg
      ansible.builtin.debug:
        msg: myvar {{ myvar }} ,my2var {{ my2var }}
      vars: 
        my2var: "{{ myvar }}"

