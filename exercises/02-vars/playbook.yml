---
- name: Ping all hosts
  hosts: grp_nodes
  gather_facts: false
  tasks:
    - name: Ping
      ansible.builtin.ping:
    - name: Collect facts
      ansible.builtin.setup:
    - name: Debug_msg
      ansible.builtin.debug:
        msg: System {{ ansible_facts["hostname"] }} has gateway {{ ansible_facts['default_ipv4']['gateway'] }}
    - name: Debug_var
      ansible.builtin.debug:
        var: ansible_facts